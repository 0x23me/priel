# On a tag vX.Y.Z: builds the OPNsense plugin packages and attaches them to the release.
# The Mac app is signed and notarized on a Mac (mac/Scripts/release.sh) and uploaded with
# gh release upload.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  opnsense:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cd opnsense && sh build-pkg.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Priel ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" opnsense/dist/*.pkg --clobber
