name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'opnsense/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: opnsense/tools/go.sum
      # The plugin's pkg repository, under site/opnsense/FreeBSD:15:amd64 and the like.
      - name: OPNsense pkg repository
        env:
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -z "$PKG_SIGNING_KEY" ]; then echo "no PKG_SIGNING_KEY secret: the site goes up without the pkg repository"; exit 0; fi
          key=$(mktemp) && printf '%s\n' "$PKG_SIGNING_KEY" > "$key"
          sh opnsense/build-repo.sh site/opnsense "$key"
          rm -f "$key"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
