[start]
command:/usr/local/etc/rc.d/juistd start && /usr/local/opnsense/scripts/juist/juist.py keep-host-dns > /dev/null
type:script
message:starting juistd

[stop]
command:/usr/local/etc/rc.d/juistd stop; exit 0
type:script
message:stopping juistd

[restart]
command:/usr/local/etc/rc.d/juistd restart && /usr/local/opnsense/scripts/juist/juist.py keep-host-dns > /dev/null
type:script
message:restarting juistd

[status]
command:/usr/local/etc/rc.d/juistd status; exit 0
type:script_output
message:request juistd status

[query]
command:/usr/local/opnsense/scripts/juist/juist.py
parameters:%s
type:script_output
message:juist query %s

[invite]
command:/usr/local/opnsense/scripts/juist/juist.py invite
parameters:%s %s
type:script_output
message:juist invite %s %s

[remove]
command:/usr/local/opnsense/scripts/juist/juist.py remove
parameters:%s
type:script_output
message:juist remove %s
